<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  input, select, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:var(--card); color:var(--text); }
  input { flex:1; min-width:180px; }
  button { background:var(--accent); color:#06222f; border:0; font-weight:600; cursor:pointer; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; }
  .temp { font-size:3rem; font-weight:700; }
  .muted { color:var(--muted); }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:12px; }
  .day { background:#0f172a; border-radius:10px; padding:12px; }
  #error { color:#fca5a5; margin-bottom:12px; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:6px 0; border-bottom:1px solid #334155; }
</style>
</head>
<body>
<main>
  <h1>Weather Dashboard</h1>
  <form id="form">
    <input id="city" placeholder="Search a city, e.g. Karachi" required>
    <select id="units"><option value="metric">°C</option><option value="imperial">°F</option></select>
    <button type="submit">Search</button>
  </form>
  <div id="error"></div>
  <section id="current" class="card" hidden></section>
  <section id="forecast" class="grid"></section>
  <section class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Recent searches</h3>
    <ul id="history"></ul>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function search(city, units) {
  $('error').textContent = '';
  try {
    const r = await fetch(`/api/weather?city=${encodeURIComponent(city)}&units=${units}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    render(d);
    loadHistory();
  } catch (e) { $('error').textContent = e.message; }
}

function render(d) {
  const u = d.units === 'imperial' ? '°F' : '°C';
  const w = d.units === 'imperial' ? 'mph' : 'km/h';
  const c = d.current;
  $('current').hidden = false;
  $('current').innerHTML = `
    <div class="muted">${esc(d.city)}, ${esc(d.country)}</div>
    <div class="temp">${esc(c.temperature)}${u}</div>
    <div>${esc(c.summary)} · feels like ${esc(c.feelsLike)}${u}</div>
    <div class="muted">Humidity ${esc(c.humidity)}% · Wind ${esc(c.windSpeed)} ${w} · Pressure ${esc(c.pressureHpa)} hPa</div>`;
  $('forecast').innerHTML = d.forecast.map(f => `
    <div class="day"><strong>${esc(f.date)}</strong><br>${esc(f.summary)}<br>
    ${esc(f.tempMax)}${u} / ${esc(f.tempMin)}${u}<br><span class="muted">${esc(f.precipitationMm)} mm</span></div>`).join('');
}

async function loadHistory() {
  try {
    const d = await (await fetch('/api/history')).json();
    $('history').innerHTML = (d.history || []).map(h =>
      `<li>${esc(h.city)}, ${esc(h.country)} — ${esc(h.temperature)}${h.units === 'imperial' ? '°F' : '°C'}, ${esc(h.summary)}
       <span class="muted">(${new Date(h.searchedAt * 1000).toLocaleString()})</span></li>`).join('') || '<li class="muted">No searches yet</li>';
  } catch (e) { /* history is optional */ }
}

$('form').addEventListener('submit', e => { e.preventDefault(); search($('city').value.trim(), $('units').value); });
loadHistory();
</script>
</body>
</html>
